<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prépa — Corrida de Rambouillet</title>
<meta name="description" content="Calendrier d'entraînement : course à pied, vélo, natation, avec compte à rebours.">
<meta name="theme-color" content="#262222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prépa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Roboto Slab';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/roboto-slab-latin-wght-normal.woff2) format('woff2-variations'),url(fonts/roboto-slab-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Roboto';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/roboto-latin-wght-normal.woff2) format('woff2-variations'),url(fonts/roboto-latin-wght-normal.woff2) format('woff2')}
:root{
  --bg:#262222; --panel:#312c2c; --panel2:#3b3535; --line:#433d3d; --text:#faf9f9; --muted:#aaa2a2; --faint:#7d7575;
  --red:#e13232; --run:#ff8a4c; --bike:#b6f23a; --swim:#5aaaff; --gym:#c79bff; --race:#e13232;
  --display:'Roboto Slab',Rockwell,'Rockwell Std',Georgia,serif;
  --body:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  --pad:clamp(16px,3vw,40px); --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-weight:400;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:0 var(--pad) 110px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 0}
.logo{display:block;width:84px;height:56px;background:var(--text);-webkit-mask:url(logo.png) left center/contain no-repeat;mask:url(logo.png) left center/contain no-repeat}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:12px 18px;border:1px solid var(--text);border-radius:999px;white-space:nowrap}
.btn:hover{background:var(--text);color:var(--bg)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{border-color:var(--text);color:var(--bg)}
.btn.solid{background:var(--text);color:var(--bg)}
.btn.solid:hover{background:#fff}
.btn.danger{border-color:#7a2f2f;color:#ff8a8a}
.btn.danger:hover{background:#ff8a8a;color:var(--bg)}

/* ---------- compte à rebours (discret) ---------- */
.count{display:flex;justify-content:flex-end;align-items:center;gap:var(--pad);padding:18px 0 20px;border-bottom:1px solid var(--line)}
.cw{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.cw b{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;background:var(--red);color:#fff;padding:6px 11px;border-radius:999px}
.count-side{width:min(340px,100%)}
.rc{display:block;width:100%;border:1px solid var(--red);background:rgba(225,50,50,.1);padding:12px 16px;border-radius:var(--r);transition:background .15s}
.rc:hover{background:rgba(225,50,50,.22)}
.rc .k{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;color:#ff6a6a}
.rc .wk{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.06em;background:var(--red);color:#fff;padding:5px 10px;border-radius:999px}
.rc .n{font-family:var(--display);font-weight:800;font-size:15px;margin:6px 0 4px;line-height:1.2}
.rc .m{font-size:12px;color:var(--muted);line-height:1.4}

/* ---------- toolbar ---------- */
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:clamp(20px,3vw,30px) 0 14px}
.h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.6vw,56px);line-height:1;letter-spacing:-.01em}
.h1 small{display:block;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:11px 16px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.arrow{width:44px;height:40px;border:1px solid var(--line);border-radius:999px;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.arrow:hover{border-color:var(--text)}

.legend{display:flex;gap:18px;flex-wrap:wrap;padding:6px 0 16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--text));flex:none}
.dot.plan{background:transparent;border:2px solid var(--c)}

.sum{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:clamp(16px,2.5vw,26px)}
.sum>div{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.sum>div:first-child{border-left:0}
.sum .t{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em}
.sum .v{font-size:clamp(18px,2.2vw,26px);font-weight:300;margin-top:8px;white-space:nowrap}
.sum .d{font-size:12px;color:var(--muted);margin-top:3px}

/* ---------- semaine ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:40px}
.day{display:flex;flex-direction:column;gap:8px;min-width:0;border-radius:var(--r)}
.dh{display:block;width:100%;padding:10px 4px 6px;border-radius:12px}
.dh .dn{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.dh .dw{font-family:var(--display);font-weight:800;font-size:clamp(18px,2vw,28px);margin-top:4px}
.dh:hover .dw{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.dh .hb{font-family:var(--display);font-weight:700;font-size:9px;letter-spacing:.12em;color:var(--faint);margin-top:6px}
.day.today .dh{background:var(--red);color:#fff;padding:10px 10px 8px}
.day.today .dh .dn,.day.today .dh .hb{color:rgba(255,255,255,.78)}
.day.past .dw{color:var(--muted)}
.dcol{display:flex;flex-direction:column;gap:8px;flex:1;min-height:170px}

.sw{position:relative;border-radius:var(--r);overflow:hidden}
.sw::before{content:attr(data-rev);position:absolute;inset:0;display:flex;align-items:center;padding:0 20px;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.14em;background:var(--text);color:var(--bg);opacity:0}
.sw[data-dir]::before{opacity:1}
.sw[data-dir="r"]::before{justify-content:flex-start}
.sw[data-dir="l"]::before{justify-content:flex-end}
.sess{display:block;width:100%;padding:13px 14px 12px;background:var(--panel);border-radius:var(--r);border-left:4px solid var(--c);position:relative;touch-action:pan-y;transition:transform .2s,opacity .25s}
.sess.swiping{transition:none}
.sess:hover{background:var(--panel2)}
.sess.done{opacity:.42}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.12em;min-width:0;flex-wrap:wrap}
.tag .wh{color:var(--muted);font-weight:500}
.st{flex:none;font-family:var(--display);font-weight:700;font-size:9px;letter-spacing:.1em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st:hover{border-color:var(--text);color:var(--text)}
.st.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.sess .name{display:block;font-size:15px;font-weight:500;margin-top:10px;line-height:1.25;overflow-wrap:anywhere}
.sess .big{display:block;font-size:clamp(20px,2vw,28px);font-weight:300;margin-top:4px;line-height:1.1}
.sess .sub{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.add{display:block;width:100%;padding:11px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:13px;text-align:center;margin-top:auto}
.add:hover{color:var(--text);border-color:var(--text)}
.race{display:block;width:100%;border:1px solid var(--red);background:rgba(225,50,50,.12);border-radius:var(--r);padding:13px 12px}
.race:hover{background:rgba(225,50,50,.24)}
.race .k{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;color:#ff6a6a}
.race .n{font-family:var(--display);font-weight:800;font-size:clamp(14px,1.25vw,18px);line-height:1.15;margin:8px 0 6px;overflow-wrap:anywhere;hyphens:auto}
.race .m{font-size:12px;color:var(--muted);line-height:1.4}

/* ---------- mois ---------- */
.month{margin-bottom:40px}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead div{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line)}
.mc{min-height:104px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:8px}
.mc:nth-child(7n+1){border-left:0}
.mc.out{opacity:.35}
.mc:hover{background:var(--panel)}
.mc .num{font-family:var(--display);font-weight:800;font-size:13px}
.mc.today .num{background:var(--red);color:#fff;display:inline-block;padding:3px 8px;border-radius:999px;align-self:flex-start}
.mc .dots{display:flex;gap:5px;flex-wrap:wrap}
.mc .rflag{font-family:var(--display);font-weight:700;font-size:9px;letter-spacing:.1em;color:#fff;background:var(--red);padding:4px 7px;border-radius:999px;align-self:flex-start}
.mtot{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));border:1px solid var(--line);border-top:0}
.mtot>div{padding:12px 14px;border-left:1px solid var(--line);font-size:13px;color:var(--muted)}
.mtot>div:first-child{border-left:0}
.mtot b{display:block;color:var(--text);font-weight:300;font-size:20px;margin-top:6px}

/* ---------- fenêtres ---------- */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);margin:auto;overflow:auto;border-radius:20px}
dialog::backdrop{background:rgba(0,0,0,.72)}
.sheet{padding:clamp(18px,3vw,28px)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);letter-spacing:-.01em;line-height:1.1}
.sheet h2 small{display:block;font-weight:700;font-size:10px;letter-spacing:.18em;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:7px;margin-top:18px;flex:1;min-width:120px}
.field label,.lbl{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;padding:12px;width:100%;border-radius:10px;color-scheme:dark}
textarea{resize:vertical;min-height:84px;line-height:1.4}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.types.two{grid-template-columns:repeat(2,1fr)}
.types input{position:absolute;opacity:0;pointer-events:none}
.types label{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 6px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.types input:checked+label{border-color:var(--c,var(--text));color:var(--text);background:rgba(255,255,255,.06)}
.types input:focus-visible+label{outline:2px solid var(--text);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;justify-content:space-between}
.actions .grp{display:flex;gap:10px;flex-wrap:wrap}
.list{margin-top:18px;border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.li .tg{flex:1;min-width:0;text-align:left}
.li .tg b{display:block;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tg span{font-size:13px;color:var(--muted)}
.empty{padding:22px 0;color:var(--muted);font-size:14px}
.menu-list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:10px 14px;border:1px solid var(--line);border-radius:999px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.tile{display:flex;align-items:center;gap:12px;padding:18px 16px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r);font-family:var(--display);font-weight:800;font-size:14px}
.tile:hover{border-color:var(--text);border-left-color:var(--c)}
.tile small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}

/* ---------- bouton + ---------- */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:32px;line-height:1;font-weight:300;box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:50;transition:transform .15s}
.fab:hover{transform:scale(1.06)}

/* ---------- glisser-déposer ---------- */
.sess{cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.sess.dragging{opacity:.28}
.drag-ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;background:var(--panel2);border:1px solid var(--c,var(--text));padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:.96;transform:translate(0,0);touch-action:none}
.drag-ghost .sub,.drag-ghost .st{display:none}
body.is-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
body.is-dragging .sess{cursor:grabbing}
.day.drop{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px var(--text)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:10000;background:var(--text);color:var(--bg);display:flex;gap:14px;align-items:center;padding:12px 18px;font-size:14px;border-radius:999px;max-width:calc(100vw - 24px);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.1em;text-decoration:underline;text-underline-offset:4px;padding:4px 2px}

/* ---------- mobile ---------- */
@media (max-width:1100px){ .sess .big{font-size:20px} }
@media (max-width:860px){
  .count{flex-direction:column;align-items:stretch;gap:12px}
  .count-side{width:100%}
  .sum>div{padding:12px}
  .sum .v{font-size:18px}
  .week{display:block;margin-bottom:30px}
  .day{margin-bottom:18px}
  .dh{display:flex;align-items:baseline;gap:10px;padding:8px 4px}
  .dh .dw{order:1;margin:0;font-size:22px}
  .dh .dn{order:2}
  .dh .hb{order:3;margin:0 0 0 auto}
  .day.today .dh{padding:8px 12px}
  .dcol{min-height:0}
  .add{margin-top:0}
  .mc{min-height:68px;padding:8px 4px}
  .mtot>div{padding:10px;font-size:12px}
  .mtot b{font-size:15px}
}
@media (max-width:520px){
  .btn{padding:11px 14px}
  .top-actions .hide-s{display:none}
  .types{grid-template-columns:repeat(2,1fr)}
  .types.two{grid-template-columns:repeat(2,1fr)}
  .tiles{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="logo" role="img" aria-label="Kokoro"></span>
    <div class="top-actions">
      <button class="btn ghost" id="btnToday">Aujourd'hui</button>
      <button class="btn" id="btnMenu" aria-label="Menu">Menu</button>
    </div>
  </header>

  <section class="count" aria-label="Course">
    <div class="count-side"><button class="rc" id="raceCard"></button></div>
  </section>

  <section class="bar">
    <h1 class="h1" id="title"></h1>
    <div class="nav">
      <div class="seg" role="group" aria-label="Vue">
        <button id="vWeek" aria-pressed="true">Semaine</button>
        <button id="vMonth" aria-pressed="false">Mois</button>
      </div>
      <button class="arrow" id="prev" aria-label="Précédent">&larr;</button>
      <button class="arrow" id="next" aria-label="Suivant">&rarr;</button>
    </div>
  </section>

  <div class="legend" id="legend"></div>
  <div class="sum" id="sum"></div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Ajouter une séance">+</button>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const SEED = {"version": 2, "settings": {"raceName": "Corrida de Rambouillet", "raceDate": "2026-12-19", "raceKm": 11, "raceTime": "Course nocturne", "raceGoal": "47:00 / 48:00"}, "sessions": [{"id": "p2-001", "date": "2026-11-16", "type": "bike", "title": "HT qualité — sweet spot", "km": null, "min": 60, "when": "", "notes": "2×15' à 88-93 % FTP, récup 5'. Échauffement et retour au calme faciles.", "done": false}, {"id": "p2-002", "date": "2026-11-17", "type": "run", "title": "Fractionné club", "km": 8, "min": 50, "when": "soir", "notes": "Fractionné du club, au feeling. Si tu ne peux pas y aller, déplace-le.", "done": false}, {"id": "p2-003", "date": "2026-11-18", "type": "bike", "title": "HT endurance Z2", "km": null, "min": 60, "when": "", "notes": "Facile, cadence fluide.", "done": false}, {"id": "p2-004", "date": "2026-11-19", "type": "swim", "title": "Natation club", "km": null, "min": 60, "when": "", "notes": "Séance du club.", "done": false}, {"id": "p2-005", "date": "2026-11-20", "type": "run", "title": "Seuil 2×8'", "km": 7.5, "min": 39, "when": "", "notes": "10' échauffement + 2×8' à 4:22 (récup 2') + 8' retour au calme. Trop chargé ? Remplace par une EF.", "done": false}, {"id": "p2-006", "date": "2026-11-21", "type": "run", "title": "EF", "km": 9, "min": 46, "when": "", "notes": "Facile (≈5:20-5:40/km). Sans montre ou à deux si possible.", "done": false}, {"id": "p2-007", "date": "2026-11-22", "type": "bike", "title": "Sortie Z2", "km": null, "min": 60, "when": "", "notes": "Libre et facile.", "done": false}, {"id": "p2-008", "date": "2026-11-23", "type": "bike", "title": "HT qualité — VO2 ou sweet spot", "km": null, "min": 60, "when": "", "notes": "Au choix selon la forme.", "done": false}, {"id": "p2-009", "date": "2026-11-24", "type": "run", "title": "Fractionné club", "km": 8, "min": 50, "when": "soir", "notes": "Fractionné du club, au feeling. Si tu ne peux pas y aller, déplace-le.", "done": false}, {"id": "p2-010", "date": "2026-11-25", "type": "bike", "title": "HT endurance Z2", "km": null, "min": 60, "when": "", "notes": "Facile, cadence fluide.", "done": false}, {"id": "p2-011", "date": "2026-11-26", "type": "swim", "title": "Natation club", "km": null, "min": 60, "when": "", "notes": "Séance du club.", "done": false}, {"id": "p2-012", "date": "2026-11-27", "type": "run", "title": "Seuil 2×10'", "km": 8.5, "min": 44, "when": "", "notes": "10' échauffement + 2×10' à 4:20 (récup 2') + 10' retour au calme.", "done": false}, {"id": "p2-013", "date": "2026-11-28", "type": "run", "title": "EF", "km": 11, "min": 57, "when": "", "notes": "Facile.", "done": false}, {"id": "p2-014", "date": "2026-11-29", "type": "bike", "title": "Sortie Z2", "km": null, "min": 90, "when": "", "notes": "Libre et facile.", "done": false}, {"id": "p2-015", "date": "2026-11-30", "type": "bike", "title": "HT qualité", "km": null, "min": 60, "when": "", "notes": "Sweet spot ou VO2.", "done": false}, {"id": "p2-016", "date": "2026-12-01", "type": "run", "title": "Fractionné club", "km": 8, "min": 50, "when": "soir", "notes": "Fractionné du club, au feeling. Si tu ne peux pas y aller, déplace-le.", "done": false}, {"id": "p2-017", "date": "2026-12-02", "type": "bike", "title": "HT endurance Z2", "km": null, "min": 60, "when": "", "notes": "Facile, cadence fluide.", "done": false}, {"id": "p2-018", "date": "2026-12-03", "type": "swim", "title": "Natation club", "km": null, "min": 60, "when": "", "notes": "Séance du club.", "done": false}, {"id": "p2-019", "date": "2026-12-04", "type": "run", "title": "TEST 3 km", "km": 8.5, "min": 44, "when": "", "notes": "20' échauffement progressif + 3 km chrono + retour au calme. Cible ≈ 11:50 (obj. 47:00) / ≈ 12:10 (obj. 48:00). Indication, pas un verdict.", "done": false}, {"id": "p2-020", "date": "2026-12-05", "type": "run", "title": "EF", "km": 12, "min": 62, "when": "", "notes": "Facile.", "done": false}, {"id": "p2-021", "date": "2026-12-06", "type": "bike", "title": "Sortie Z2", "km": null, "min": 90, "when": "", "notes": "Libre et facile.", "done": false}, {"id": "p2-022", "date": "2026-12-07", "type": "bike", "title": "HT qualité", "km": null, "min": 60, "when": "", "notes": "Sweet spot.", "done": false}, {"id": "p2-023", "date": "2026-12-08", "type": "run", "title": "Fractionné club", "km": 8, "min": 50, "when": "soir", "notes": "Fractionné du club, au feeling. Si tu ne peux pas y aller, déplace-le.", "done": false}, {"id": "p2-024", "date": "2026-12-09", "type": "bike", "title": "HT endurance Z2", "km": null, "min": 60, "when": "", "notes": "Facile, cadence fluide.", "done": false}, {"id": "p2-025", "date": "2026-12-10", "type": "swim", "title": "Natation club", "km": null, "min": 60, "when": "", "notes": "Séance du club.", "done": false}, {"id": "p2-026", "date": "2026-12-11", "type": "run", "title": "Spécifique", "km": 9.5, "min": 49, "when": "", "notes": "Allure choisie après le test — à détailler début décembre.", "done": false}, {"id": "p2-027", "date": "2026-12-12", "type": "run", "title": "EF", "km": 12, "min": 62, "when": "", "notes": "Facile.", "done": false}, {"id": "p2-028", "date": "2026-12-13", "type": "bike", "title": "Sortie Z2", "km": null, "min": 60, "when": "", "notes": "Libre et facile.", "done": false}, {"id": "p2-029", "date": "2026-12-14", "type": "bike", "title": "HT endurance Z2", "km": null, "min": 45, "when": "", "notes": "Facile.", "done": false}, {"id": "p2-030", "date": "2026-12-15", "type": "run", "title": "Touches allure course", "km": 7, "min": 36, "when": "soir", "notes": "Échauffement + 2-3×3' à allure course + retour au calme. À la place du fractionné club si tu es fatigué.", "done": false}, {"id": "p2-031", "date": "2026-12-16", "type": "bike", "title": "HT endurance Z2", "km": null, "min": 60, "when": "", "notes": "Facile.", "done": false}, {"id": "p2-032", "date": "2026-12-17", "type": "swim", "title": "Natation club", "km": null, "min": 60, "when": "", "notes": "Séance du club.", "done": false}, {"id": "p2-033", "date": "2026-12-18", "type": "bike", "title": "Activation", "km": null, "min": 30, "when": "", "notes": "Facile, jambes fraîches.", "done": false}]};
</script>
<script>
(function(){
'use strict';
const TYPES={
  run:{label:'CAP',name:'Course à pied',color:'var(--run)'},
  bike:{label:'VÉLO',name:'Vélo',color:'var(--bike)'},
  swim:{label:'NAT',name:'Natation',color:'var(--swim)'},
  gym:{label:'RENFO',name:'Renfo / PPG',color:'var(--gym)'}
};
const KEYS=Object.keys(TYPES);
const DOW=['LUN','MAR','MER','JEU','VEN','SAM','DIM'];
const DOWL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const STORE='prepa-corrida-v1';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const mondayOf=d=>addDays(dayStart(d),-((d.getDay()+6)%7));
const diff=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
const fmtDM=d=>d.getDate()+'.'+pad(d.getMonth()+1);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)&&n>0?n:null;};
const fmtKm=k=>k?(Math.round(k*10)/10).toString().replace('.',',')+' km':'';
const fmtDur=m=>{if(!m)return'';const t=Math.round(m),h=Math.floor(t/60),r=t%60;return h?h+'h'+pad(r):r+' min';};
const uid=()=>'u-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- state ---------- */
function clone(o){return JSON.parse(JSON.stringify(o));}
const fresh=()=>Object.assign(clone(SEED),{seedVersion:SEED.version});
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(STORE));}catch(e){}
  if(!(s&&Array.isArray(s.sessions)&&s.settings))return fresh();
  if(s.seedVersion!==SEED.version){      // nouvelle version du plan : on garde tes séances faites, modifiées ou créées
    const keep=s.sessions.filter(x=>!/^p\d*-/.test(String(x.id))||x.done||x.edited);
    s.sessions=keep.concat(clone(SEED.sessions));
    s.settings=Object.assign({},SEED.settings,s.settings);
    s.seedVersion=SEED.version;
  }
  return s;
}
let state=load();
const WHEN=['','matin','midi','après-midi','soir'];
const WHEN_ORDER={'matin':1,'midi':2,'après-midi':3,'soir':4,'':5};
const HABITS={1:{type:'run',title:'Fractionné club',km:8,min:50,when:'soir',label:'FRACTIONNÉ · SOIR'},
              3:{type:'swim',title:'Natation club',km:'',min:60,when:'',label:'PISCINE'}};
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
save();
const today=()=>dayStart(new Date());
let view='week';
let cursor=today();   // any date inside the displayed week / month

const sessionsOn=k=>state.sessions.filter(s=>s.date===k).sort((a,b)=>(WHEN_ORDER[a.when||'']||5)-(WHEN_ORDER[b.when||'']||5));
const typeOf=t=>TYPES[t]?t:'run';

/* ---------- countdown ---------- */
function renderCount(){
  const r=parse(state.settings.raceDate),d=diff(today(),r);
  let chip;
  if(d>0){const w=diff(mondayOf(today()),mondayOf(r))/7;chip=w>0?'S−'+w:'SEMAINE DE COURSE';}
  else if(d===0)chip='J-0';else chip='FIN';
  const S=state.settings;
  $('#raceCard').innerHTML='<span class="k"><b class="wk">'+chip+'</b>COURSE · '+esc(DOW[(r.getDay()+6)%7])+' '+fmtDM(r)+'</span><div class="n">'+esc(S.raceName)+'</div><div class="m">'+
    [S.raceKm?fmtKm(num(S.raceKm)):'',S.raceTime?esc(S.raceTime):'',S.raceGoal?'Objectif '+esc(S.raceGoal):''].filter(Boolean).join(' · ')+'</div>';
}

/* ---------- totals ---------- */
function totals(list){
  const t={};KEYS.forEach(k=>t[k]={km:0,min:0,dkm:0,dmin:0,n:0,dn:0});
  list.forEach(s=>{const x=t[typeOf(s.type)];x.n++;x.km+=num(s.km)||0;x.min+=num(s.min)||0;if(s.done){x.dn++;x.dkm+=num(s.km)||0;x.dmin+=num(s.min)||0;}});
  return t;
}
function sumHTML(t,showGym){
  const ks=KEYS.filter(k=>showGym||k!=='gym'||t[k].n);
  $('#sum').style.setProperty('--n',ks.length);
  return ks.map(k=>{
    const x=t[k],T=TYPES[k];
    const main=x.km?fmtKm(x.km):(x.min?fmtDur(x.min):'—');
    const det=[x.km&&x.min?fmtDur(x.min):'',x.n?'fait '+(x.dkm?fmtKm(x.dkm):fmtDur(x.dmin)||x.dn+'/'+x.n):''].filter(Boolean).join(' · ');
    return '<div><div class="t"><i class="dot" style="--c:'+T.color+'"></i>'+T.label+'</div><div class="v">'+main+'</div><div class="d">'+(det||'&nbsp;')+'</div></div>';
  }).join('');
}

/* ---------- legend ---------- */
function renderLegend(){
  $('#legend').innerHTML=KEYS.map(k=>'<span><i class="dot" style="--c:'+TYPES[k].color+'"></i>'+TYPES[k].name+'</span>').join('')+
   '<span style="margin-left:auto"><i class="dot" style="--c:var(--text)"></i>fait</span><span><i class="dot plan" style="--c:var(--text)"></i>prévu</span>';
}

/* ---------- week view ---------- */
function sessHTML(s){
  const k=typeOf(s.type),T=TYPES[k];
  const big=s.km?fmtKm(num(s.km)):(s.min?fmtDur(num(s.min)):'');
  const sub=(s.km&&s.min)?fmtDur(num(s.min)):'';
  return '<div class="sw"><button class="sess'+(s.done?' done':'')+'" data-sess="'+esc(s.id)+'" style="--c:'+T.color+'">'+
    '<span class="srow"><span class="tag"><i class="dot'+(s.done?'':' plan')+'" style="--c:'+T.color+'"></i>'+T.label+(s.when?' <span class="wh">· '+esc(s.when.toUpperCase())+'</span>':'')+'</span>'+
    '<span class="st'+(s.done?' on':'')+'" data-toggle="'+esc(s.id)+'" role="button" aria-label="Changer le statut">'+(s.done?'✓ FAIT':'À FAIRE')+'</span></span>'+
    '<span class="name">'+esc(s.title||T.name)+'</span>'+(big?'<span class="big">'+esc(big)+'</span>':'')+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</button></div>';
}
function raceBlock(){
  const S=state.settings;
  return '<button class="race" data-race="1"><span class="k">COURSE</span><div class="n">'+esc(S.raceName)+'</div><div class="m">'+
    [S.raceKm?fmtKm(num(S.raceKm)):'',S.raceTime?esc(S.raceTime):'',S.raceGoal?esc(S.raceGoal):''].filter(Boolean).join('<br>')+'</div></button>';
}
function renderWeek(){
  const mon=mondayOf(cursor),sun=addDays(mon,6),t=today(),raceK=state.settings.raceDate;
  const wr=diff(mondayOf(parse(raceK)),mon);   // <0: weeks before race
  const rel=wr<0?'S−'+(-wr/7)+' AVANT LA COURSE':(wr===0?'SEMAINE DE COURSE':'APRÈS LA COURSE');
  $('#title').innerHTML='<small>'+esc(rel)+'</small>'+fmtDM(mon)+' — '+fmtDM(sun);
  const list=[];
  let h='';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),k=iso(d),ss=sessionsOn(k);
    list.push(...ss);
    const cls='day'+(diff(t,d)===0?' today':'')+(diff(t,d)<0?' past':'');
    h+='<div class="'+cls+'" data-date="'+k+'"><button class="dh" data-day="'+k+'" aria-label="Ouvrir '+DOWL[i]+' '+fmtDM(d)+'"><div class="dn">'+fmtDM(d)+'</div><div class="dw">'+DOW[i]+'</div>'+(HABITS[i]?'<div class="hb">'+HABITS[i].label+'</div>':'')+'</button>'+
      '<div class="dcol">'+(k===raceK?raceBlock():'')+ss.map(sessHTML).join('')+'<button class="add" data-add="'+k+'">+ Ajouter</button></div></div>';
  }
  $('#sum').innerHTML=sumHTML(totals(list),false);
  $('#view').innerHTML='<div class="week">'+h+'</div>';
}

/* ---------- month view ---------- */
function renderMonth(){
  const first=new Date(cursor.getFullYear(),cursor.getMonth(),1);
  const start=mondayOf(first),t=today(),raceK=state.settings.raceDate;
  $('#title').innerHTML='<small>'+cursor.getFullYear()+'</small>'+MONTHS[cursor.getMonth()];
  let cells='',list=[];
  const last=new Date(cursor.getFullYear(),cursor.getMonth()+1,0);
  const n=Math.ceil((diff(start,last)+1)/7)*7;
  for(let i=0;i<n;i++){
    const d=addDays(start,i),k=iso(d),ss=sessionsOn(k),out=d.getMonth()!==cursor.getMonth();
    if(!out)list.push(...ss);
    cells+='<button class="mc'+(out?' out':'')+(diff(t,d)===0?' today':'')+'" data-day="'+k+'" aria-label="'+d.getDate()+' '+MONTHS[d.getMonth()]+'"><span class="num">'+d.getDate()+'</span>'+
      (k===raceK?'<span class="rflag">COURSE</span>':'')+
      '<span class="dots">'+ss.map(s=>'<i class="dot'+(s.done?'':' plan')+'" style="--c:'+TYPES[typeOf(s.type)].color+'"></i>').join('')+'</span></button>';
  }
  const tt=totals(list);
  $('#sum').innerHTML='';
  const mk=KEYS.filter(k=>k!=='gym'||tt[k].n);
  $('#view').innerHTML='<div class="month"><div class="mhead">'+DOW.map(x=>'<div>'+x+'</div>').join('')+'</div><div class="mgrid">'+cells+'</div>'+
    '<div class="mtot" style="--n:'+mk.length+'">'+mk.map(k=>'<div><i class="dot" style="--c:'+TYPES[k].color+'"></i> '+TYPES[k].label+'<b>'+(tt[k].km?fmtKm(tt[k].km)+' · ':'')+(fmtDur(tt[k].min)||'—')+'</b></div>').join('')+'</div></div>';
}

function render(){
  renderCount();renderLegend();
  $('#vWeek').setAttribute('aria-pressed',view==='week');
  $('#vMonth').setAttribute('aria-pressed',view==='month');
  if(view==='week')renderWeek();else renderMonth();
}

/* ---------- dialogs ---------- */
const dlg=$('#dlg');
function openSheet(html){dlg.innerHTML='<div class="sheet">'+html+'</div>';if(!dlg.open)dlg.showModal();}
function closeSheet(){if(dlg.open)dlg.close();}
dlg.addEventListener('click',e=>{if(e.target===dlg)closeSheet();});

function dayTitle(k){const d=parse(k);return '<small>'+esc(DOWL[(d.getDay()+6)%7].toUpperCase())+'</small>'+d.getDate()+' '+esc(MONTHS[d.getMonth()])+' '+d.getFullYear();}

function openDay(k){
  const ss=sessionsOn(k),isRace=k===state.settings.raceDate;
  openSheet('<h2>'+dayTitle(k)+'</h2>'+
    (isRace?'<div class="list"><div class="li"><i class="dot" style="--c:var(--red)"></i><button class="tg" data-race="1"><b>'+esc(state.settings.raceName)+'</b><span>Jour de course · modifier</span></button></div></div>':'')+
    (ss.length?'<div class="list">'+ss.map(s=>{const T=TYPES[typeOf(s.type)];return '<div class="li"'+(s.done?' style="opacity:.5"':'')+'><i class="dot" style="--c:'+T.color+'"></i><button class="tg" data-sess="'+esc(s.id)+'"><b>'+esc(s.title||T.name)+'</b><span>'+esc([T.label,fmtKm(num(s.km)),fmtDur(num(s.min))].filter(Boolean).join(' · '))+'</span></button><button class="st'+(s.done?' on':'')+'" data-toggle="'+esc(s.id)+'" data-keep="1">'+(s.done?'✓ FAIT':'À FAIRE')+'</button></div>';}).join('')+'</div>':(isRace?'':'<p class="empty">Rien de prévu ce jour-là.</p>'))+
    '<div class="actions"><div class="grp"><button class="btn solid" data-add="'+k+'">+ Séance</button></div><button class="btn ghost" data-close="1">Fermer</button></div>');
}

function openSession(id,date,type){
  const ex=id?state.sessions.find(s=>s.id===id):null;
  const dflt=date?HABITS[(parse(date).getDay()+6)%7]:null;
  const s=ex||Object.assign({id:null,date:date||iso(today()),type:'run',title:'',km:'',min:'',when:'',notes:'',done:false},dflt?{type:dflt.type,title:dflt.title,km:dflt.km,min:dflt.min,when:dflt.when}:{},(!ex&&type)?{type:type,title:(dflt&&dflt.type===type)?dflt.title:'',km:(dflt&&dflt.type===type)?dflt.km:'',min:(dflt&&dflt.type===type)?dflt.min:'',when:(dflt&&dflt.type===type)?dflt.when:''}:{});
  openSheet('<h2><small>'+(ex?'MODIFIER':'NOUVELLE SÉANCE')+'</small>'+(ex?esc(ex.title||TYPES[typeOf(ex.type)].name):'Ajouter')+'</h2>'+
   '<form id="sf" autocomplete="off">'+
   '<div class="field"><span class="lbl">DISCIPLINE</span><div class="types">'+KEYS.map(k=>'<input type="radio" name="type" id="t-'+k+'" value="'+k+'"'+(typeOf(s.type)===k?' checked':'')+'><label for="t-'+k+'" style="--c:'+TYPES[k].color+'"><i class="dot" style="--c:'+TYPES[k].color+'"></i>'+TYPES[k].label+'</label>').join('')+'</div></div>'+
   '<div class="field"><label for="f-title">TITRE</label><input type="text" id="f-title" name="title" value="'+esc(s.title)+'" placeholder="ex. Seuil 2×10\'"></div>'+
   '<div class="row"><div class="field"><label for="f-date">DATE</label><input type="date" id="f-date" name="date" value="'+esc(s.date)+'" required></div>'+
   '<div class="field"><label for="f-when">MOMENT</label><select id="f-when" name="when">'+WHEN.map(w=>'<option value="'+esc(w)+'"'+((s.when||'')===w?' selected':'')+'>'+(w?w.charAt(0).toUpperCase()+w.slice(1):'Non précisé')+'</option>').join('')+'</select></div></div>'+
   '<div class="row"><div class="field"><label for="f-km">DISTANCE (KM)</label><input type="text" inputmode="decimal" id="f-km" name="km" value="'+esc(s.km||'')+'" placeholder="—"></div>'+
   '<div class="field"><label for="f-min">DURÉE (MIN)</label><input type="text" inputmode="numeric" id="f-min" name="min" value="'+esc(s.min||'')+'" placeholder="—"></div></div>'+
   '<div class="field"><label for="f-notes">NOTES</label><textarea id="f-notes" name="notes" placeholder="Détail de la séance, ressenti…">'+esc(s.notes||'')+'</textarea></div>'+
   '<div class="field"><span class="lbl">STATUT</span><div class="types two"><input type="radio" name="done" id="d-off" value="off"'+(s.done?'':' checked')+'><label for="d-off">À FAIRE</label><input type="radio" name="done" id="d-on" value="on"'+(s.done?' checked':'')+'><label for="d-on">✓ FAIT</label></div></div>'+
   '<div class="actions"><div class="grp"><button class="btn solid" type="submit">Enregistrer</button><button class="btn ghost" type="button" data-close="1">Annuler</button></div>'+(ex?'<button class="btn danger" type="button" data-del="'+esc(ex.id)+'">Supprimer</button>':'')+'</div></form>');
  $('#sf').addEventListener('submit',e=>{
    e.preventDefault();
    const f=new FormData(e.target);
    const rec={id:ex?ex.id:uid(),date:f.get('date')||s.date,type:typeOf(f.get('type')),title:String(f.get('title')||'').trim(),
      km:num(f.get('km')),min:num(f.get('min')),when:WHEN.includes(f.get('when'))?f.get('when'):'',notes:String(f.get('notes')||'').trim(),done:f.get('done')==='on'};
    if(ex)Object.assign(ex,rec,{edited:true});else state.sessions.push(rec);
    save();cursor=parse(rec.date);closeSheet();render();
  });
  setTimeout(()=>{const f=$('#f-title');if(f&&!ex)f.focus();},30);
}

let quickDay=null;
function openQuick(){
  const mon=mondayOf(cursor),t=today();
  const days=[];for(let i=0;i<7;i++)days.push(addDays(mon,i));
  if(!quickDay||!days.some(d=>iso(d)===quickDay))quickDay=days.some(d=>diff(t,d)===0)?iso(t):iso(days[0]);
  const chips=days.map(d=>'<button class="chip" data-chip="'+iso(d)+'" aria-pressed="'+(iso(d)===quickDay)+'">'+DOW[(d.getDay()+6)%7]+' '+d.getDate()+'</button>').join('');
  const tiles=KEYS.map(k=>'<button class="tile" data-q="'+k+'" style="--c:'+TYPES[k].color+'"><span>'+TYPES[k].label+'<small>'+TYPES[k].name+'</small></span></button>').join('');
  openSheet('<h2><small>AJOUTER</small>Quelle séance ?</h2><div class="field"><span class="lbl">JOUR</span><div class="chips">'+chips+'</div></div>'+
    '<div class="field"><span class="lbl">DISCIPLINE</span><div class="tiles">'+tiles+'</div></div>'+
    '<div class="actions"><span></span><button class="btn ghost" data-close="1">Fermer</button></div>');
}
function openRace(){
  const S=state.settings;
  openSheet('<h2><small>COURSE</small>'+esc(S.raceName)+'</h2>'+
   '<form id="rf" autocomplete="off"><div class="field"><label for="r-name">NOM</label><input type="text" id="r-name" name="raceName" value="'+esc(S.raceName)+'"></div>'+
   '<div class="row"><div class="field"><label for="r-date">DATE</label><input type="date" id="r-date" name="raceDate" value="'+esc(S.raceDate)+'" required></div>'+
   '<div class="field"><label for="r-km">DISTANCE (KM)</label><input type="text" inputmode="decimal" id="r-km" name="raceKm" value="'+esc(S.raceKm||'')+'"></div></div>'+
   '<div class="row"><div class="field"><label for="r-time">HORAIRE / LIEU</label><input type="text" id="r-time" name="raceTime" value="'+esc(S.raceTime||'')+'" placeholder="ex. départ 20h00"></div>'+
   '<div class="field"><label for="r-goal">OBJECTIF</label><input type="text" id="r-goal" name="raceGoal" value="'+esc(S.raceGoal||'')+'" placeholder="ex. 47:00"></div></div>'+
   '<div class="actions"><div class="grp"><button class="btn solid" type="submit">Enregistrer</button><button class="btn ghost" type="button" data-close="1">Annuler</button></div></div></form>');
  $('#rf').addEventListener('submit',e=>{
    e.preventDefault();const f=new FormData(e.target);
    state.settings.raceName=String(f.get('raceName')||'').trim()||'Course';
    state.settings.raceDate=f.get('raceDate')||S.raceDate;
    state.settings.raceKm=num(f.get('raceKm'))||'';
    state.settings.raceTime=String(f.get('raceTime')||'').trim();
    state.settings.raceGoal=String(f.get('raceGoal')||'').trim();
    save();closeSheet();render();
  });
}

function openMenu(){
  openSheet('<h2><small>DONNÉES</small>Menu</h2>'+
   '<p class="hint">Tes modifications sont enregistrées <b>sur cet appareil</b> (navigateur). Pour passer du téléphone à l’ordinateur, exporte puis importe le fichier.</p>'+
   '<div class="menu-list"><button class="btn" data-export="1">Exporter (sauvegarde .json)</button>'+
   '<button class="btn" data-import="1">Importer / fusionner un fichier</button>'+
   '<button class="btn danger" data-reset="1">Revenir au plan d’origine</button></div>'+
   '<input type="file" id="file" accept="application/json,.json" hidden>'+
   '<div class="actions"><span></span><button class="btn ghost" data-close="1">Fermer</button></div>');
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='prepa-sauvegarde-'+iso(today())+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function importData(obj){
  let added=0;
  if(obj&&obj.settings&&typeof obj.settings==='object')state.settings=Object.assign({},state.settings,obj.settings);
  if(obj&&Array.isArray(obj.sessions)){
    const m=new Map(state.sessions.map(s=>[s.id,s]));
    obj.sessions.forEach(s=>{if(s&&s.id&&/^\d{4}-\d{2}-\d{2}$/.test(s.date||'')){if(!m.has(s.id))added++;m.set(String(s.id),{id:String(s.id),date:s.date,type:typeOf(s.type),title:String(s.title||''),km:num(s.km),min:num(s.min),when:WHEN.includes(s.when)?s.when:'',notes:String(s.notes||''),done:!!s.done});}});
    state.sessions=[...m.values()];
  }
  save();render();return added;
}

/* ---------- statut ---------- */
function setDone(id,val){
  const s=state.sessions.find(x=>x.id===id);
  if(!s||!!s.done===val)return;
  s.done=val;save();render();
  toast(val?'Séance faite ✓':'Remise à faire',()=>{s.done=!val;save();render();});
}

/* ---------- toast ---------- */
let toastTimer=null,undoFn=null;
function toast(msg,undo){
  const t=$('#toast');undoFn=undo||null;
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-undo="1">ANNULER</button>':'');
  t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),6000);
}

/* ---------- glisser-déposer (souris + appui long au doigt) ---------- */
let drag=null,blockClickUntil=0;
function dragCleanup(){
  if(!drag)return;
  clearTimeout(drag.timer);clearInterval(drag.scroller);
  if(drag.ghost)drag.ghost.remove();
  if(drag.el){drag.el.classList.remove('dragging','swiping');drag.el.style.transform='';const w=drag.el.closest('.sw');if(w){delete w.dataset.dir;delete w.dataset.rev;}}
  document.querySelectorAll('.day.drop').forEach(d=>d.classList.remove('drop'));
  document.body.classList.remove('is-dragging');
  drag=null;
}
function startDrag(){
  if(!drag||drag.active)return;
  drag.active=true;
  const r=drag.el.getBoundingClientRect();
  const g=drag.el.cloneNode(true);g.classList.add('drag-ghost');g.classList.remove('dragging');g.style.width=r.width+'px';g.style.setProperty('--c',drag.el.style.getPropertyValue('--c'));
  document.body.appendChild(g);drag.ghost=g;drag.w=r.width;
  drag.el.classList.add('dragging');document.body.classList.add('is-dragging');
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
  drag.scroller=setInterval(()=>{ if(!drag)return; if(drag.y<80)window.scrollBy(0,-14); else if(drag.y>innerHeight-80)window.scrollBy(0,14); updateDrag(); },30);
  updateDrag();
}
function updateDrag(){
  if(!drag||!drag.active)return;
  drag.ghost.style.transform='translate('+Math.round(drag.x-drag.w/2)+'px,'+Math.round(drag.y-30)+'px)';
  const t=document.elementFromPoint(drag.x,drag.y);
  const day=t&&t.closest?t.closest('.day[data-date]'):null;
  document.querySelectorAll('.day.drop').forEach(d=>{if(d!==day)d.classList.remove('drop');});
  if(day)day.classList.add('drop');
  drag.target=day?day.dataset.date:null;
}
document.addEventListener('pointerdown',e=>{
  if(view!=='week'||(e.pointerType==='mouse'&&e.button!==0))return;
  const el=e.target.closest&&e.target.closest('.sess[data-sess]');
  if(!el)return;
  dragCleanup();
  const touch=e.pointerType!=='mouse';
  drag={id:el.dataset.sess,el,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,pid:e.pointerId,touch,active:false,target:null,timer:null};
  if(touch)drag.timer=setTimeout(startDrag,320);
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  drag.x=e.clientX;drag.y=e.clientY;
  const dist=Math.hypot(drag.x-drag.sx,drag.y-drag.sy);
  if(!drag.active){
    if(drag.touch){
      const dx=drag.x-drag.sx,dy=drag.y-drag.sy;
      if(!drag.swipe&&Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4){drag.swipe=true;clearTimeout(drag.timer);drag.el.classList.add('swiping');}
      if(drag.swipe){
        const c=Math.max(-130,Math.min(130,dx)),w=drag.el.closest('.sw');
        drag.el.style.transform='translateX('+c+'px)';
        if(w){if(c>6){w.dataset.dir='r';w.dataset.rev='✓ FAIT';}else if(c<-6){w.dataset.dir='l';w.dataset.rev='↺ À FAIRE';}else delete w.dataset.dir;}
        return;
      }
      if(dist>10)dragCleanup();return;   // le doigt bouge avant l'appui long : c'est un défilement
    }
    if(dist>6)startDrag();else return;
  }
  updateDrag();
});
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>{if(drag&&drag.touch)e.preventDefault();});
function endDrag(cancel){
  if(!drag)return;
  if(drag.swipe){
    const dx=drag.x-drag.sx,id=drag.id;
    dragCleanup();blockClickUntil=performance.now()+400;
    if(!cancel&&Math.abs(dx)>=72)setDone(id,dx>0);
    return;
  }
  const was=drag.active,id=drag.id,target=drag.target;
  dragCleanup();
  if(!was)return;
  blockClickUntil=performance.now()+400;
  if(cancel||!target)return;
  const s=state.sessions.find(x=>x.id===id);
  if(!s||s.date===target)return;
  const from=s.date;
  s.date=target;s.edited=true;save();render();
  const d=parse(target);
  toast('Déplacé au '+DOWL[(d.getDay()+6)%7].toLowerCase()+' '+fmtDM(d),()=>{s.date=from;save();render();});
}
document.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pid)endDrag(false);});
document.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pid)endDrag(true);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag&&drag.active)endDrag(true);});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const u=e.target.closest&&e.target.closest('[data-undo]');
  if(u){if(undoFn){undoFn();undoFn=null;}$('#toast').classList.remove('show');return;}
  if(performance.now()<blockClickUntil){e.preventDefault();e.stopPropagation();return;}
  const t=e.target.closest('[data-toggle],[data-chip],[data-q],[data-fab],[data-sess],[data-day],[data-add],[data-race],[data-close],[data-del],[data-export],[data-import],[data-reset]');
  if(!t)return;
  if(t.dataset.toggle){e.preventDefault();const s=state.sessions.find(x=>x.id===t.dataset.toggle);if(s){setDone(s.id,!s.done);if(dlg.open&&t.dataset.keep){const k=s.date;openDay(k);}}return;}
  if(t.dataset.chip){quickDay=t.dataset.chip;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.chip===quickDay));return;}
  if(t.dataset.q){openSession(null,quickDay,t.dataset.q);return;}
  if(t.dataset.close){closeSheet();return;}
  if(t.dataset.sess){openSession(t.dataset.sess);return;}
  if(t.dataset.add){openSession(null,t.dataset.add);return;}
  if(t.dataset.race){openRace();return;}
  if(t.dataset.day){openDay(t.dataset.day);return;}
  if(t.dataset.del){if(confirm('Supprimer cette séance ?')){state.sessions=state.sessions.filter(s=>s.id!==t.dataset.del);save();closeSheet();render();}return;}
  if(t.dataset.export){exportData();return;}
  if(t.dataset.import){$('#file').click();return;}
  if(t.dataset.reset){if(confirm('Effacer tes modifications et revenir au plan d’origine ?')){state=fresh();save();closeSheet();render();}return;}
});
document.addEventListener('change',e=>{
  const c=e.target;
  if(c.id==='file'&&c.files&&c.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const n=importData(JSON.parse(r.result));alert('Import terminé : '+n+' séance(s) ajoutée(s).');closeSheet();}catch(err){alert('Fichier illisible.');}};
    r.readAsText(c.files[0]);
  }
});
$('#raceCard').addEventListener('click',openRace);
$('#fab').addEventListener('click',openQuick);
$('#btnMenu').addEventListener('click',openMenu);
$('#btnToday').addEventListener('click',()=>{cursor=today();render();window.scrollTo({top:0,behavior:'smooth'});});
$('#vWeek').addEventListener('click',()=>{view='week';render();});
$('#vMonth').addEventListener('click',()=>{view='month';render();});
function shift(n){
  if(view==='week')cursor=addDays(cursor,7*n);
  else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);
  render();
}
$('#prev').addEventListener('click',()=>shift(-1));
$('#next').addEventListener('click',()=>shift(1));
document.addEventListener('keydown',e=>{
  if(dlg.open||/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')))return;
  if(e.key==='ArrowLeft')shift(-1);else if(e.key==='ArrowRight')shift(1);
});
// refresh the countdown if the app stays open past midnight
let lastDay=iso(today());
setInterval(()=>{const k=iso(today());if(k!==lastDay){lastDay=k;render();}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const k=iso(today());if(k!==lastDay){lastDay=k;cursor=today();}render();}});

render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body>
</html>
