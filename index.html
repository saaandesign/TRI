let cpF=1,cpMode='add';
const FACTORS=[[0.8,'−20 %'],[0.9,'−10 %'],[1,'Identique'],[1.05,'+5 %'],[1.1,'+10 %']];
const scalable=s=>{const k=typeOf(s.type);return k==='run'||k==='bike';};
function scaled(s,f){
  const g=scalable(s)?f:1;
  return {km:s.km?(g===1?num(s.km):Math.round(num(s.km)*g*2)/2):null,min:s.min?(g===1?num(s.min):Math.round(num(s.min)*g/5)*5):null};
}
function weekList(mon){const l=[];for(let i=0;i<7;i++)l.push(...sessionsOn(iso(addDays(mon,i))));return l;}
function openCopy(){cpF=1;cpMode='add';renderCopy();}
function renderCopy(){
  const mon=mondayOf(cursor),tgt=addDays(mon,7),src=weekList(mon),ex=weekList(tgt);
  const nr=src.map(x=>scaled(x,cpF));
  let km=0,min=0;src.forEach((x,i)=>{if(typeOf(x.type)==='run')km+=nr[i].km||0;min+=nr[i].min||0;});
  const cap=capKm(),warn=km>cap;
  const chips=FACTORS.map(f=>'<button class="chip" data-cpf="'+f[0]+'" aria-pressed="'+(f[0]===cpF)+'">'+f[1]+'</button>').join('');
  const modes=ex.length?'<div class="field"><span class="lbl">LA SEMAINE CIBLE A DÉJÀ '+ex.length+' SÉANCE'+(ex.length>1?'S':'')+'</span><div class="chips"><button class="chip" data-cpm="add" aria-pressed="'+(cpMode==='add')+'">Ajouter les copies</button><button class="chip" data-cpm="replace" aria-pressed="'+(cpMode==='replace')+'">Remplacer (sauf séances faites)</button></div></div>':'';
  openSheet('<h2><small>PRÉPARER</small>'+fmtDM(tgt)+' — '+fmtDM(addDays(tgt,6))+'</h2>'+
    (src.length?'<p class="hint">Copie les '+src.length+' séances de la semaine du '+fmtDM(mon)+' vers la semaine suivante. Le volume s’ajuste sur la course à pied et le vélo ; la natation du club ne change pas.</p>':'<p class="empty">La semaine affichée est vide : rien à copier.</p>')+
    (src.length?'<div class="field"><span class="lbl">VOLUME</span><div class="chips">'+chips+'</div></div>'+modes+
    '<div class="cpsum">CAP prévue : <b>'+fmtKm(km)+'</b>'+(warn?' <span style="color:var(--warn-text)">⚠ au-dessus du plafond de '+fmtKm(cap)+'</span>':'')+'<br>Temps total prévu : <b>'+(fmtDur(min)||'0')+'</b></div>':'')+
    '<div class="actions"><div class="grp">'+(src.length?'<button class="btn solid" data-cpgo="1">Copier</button>':'')+'<button class="btn ghost" data-close="1">Annuler</button></div></div>','');
}
function applyCopy(){
  const mon=mondayOf(cursor),tgt=addDays(mon,7),src=weekList(mon),created=[],removed=[];
  if(cpMode==='replace'){weekList(tgt).filter(x=>!x.done).forEach(x=>removed.push(x));state.sessions=state.sessions.filter(x=>!removed.includes(x));}
  src.forEach((x,i)=>{const v=scaled(x,cpF);
    const n={id:uid()+i,date:iso(addDays(parse(x.date),7)),type:x.type,title:x.title,km:v.km,min:v.min,when:x.when||'',notes:x.notes||'',done:false,edited:true};
    state.sessions.push(n);created.push(n);});
  cursor=tgt;save();closeSheet();render();
  toast(created.length+' séances copiées',()=>{state.sessions=state.sessions.filter(x=>!created.includes(x)).concat(removed);save();render();});
}

/* ---------- micro-animations des cartes ---------- */
function cardEl(id){return document.querySelector('.sess[data-sess="'+id+'"]');}
function popCard(id,done){
  if(reduce())return;const el=cardEl(id);if(!el)return;
  el.animate([{transform:'scale(.95)'},{transform:'scale(1.03)',offset:.55},{transform:'scale(1)'}],{duration:440,easing:'cubic-bezier(.2,.9,.3,1.2)'});
  el.querySelectorAll('.tag,.name,.big,.sub').forEach(n=>n.animate([{opacity:done?1:.42},{opacity:done?.42:1}],{duration:480,easing:'ease-out'}));
  const st=el.querySelector('.st');if(st)st.animate([{transform:'scale(.55)'},{transform:'scale(1.22)',offset:.6},{transform:'scale(1)'}],{duration:500,easing:'cubic-bezier(.2,.9,.3,1)'});
}
function appear(id){
  if(reduce())return;const el=cardEl(id);if(!el)return;
  el.animate([{opacity:0,transform:'translateY(14px) scale(.94)'},{opacity:1,transform:'none'}],{duration:480,easing:'cubic-bezier(.2,.9,.3,1.15)',delay:260,fill:'backwards'});
}
function settle(id){
  if(reduce())return;const el=cardEl(id);if(!el)return;
  el.animate([{transform:'scale(1.08)',boxShadow:'0 14px 30px rgba(0,0,0,.5)'},{transform:'scale(1)',boxShadow:'0 0 0 rgba(0,0,0,0)'}],{duration:460,easing:'cubic-bezier(.2,.9,.3,1.25)'});
}
function slideView(n){
  if(reduce())return;
  $('#view').animate([{transform:'translateX('+(n>0?40:-40)+'px)',opacity:0},{transform:'none',opacity:1}],{duration:400,easing:'cubic-bezier(.2,.9,.25,1)'});
}

/* ---------- statut ---------- */
function setDone(id,val){
  const s=state.sessions.find(x=>x.id===id);
  if(!s||!!s.done===val)return;
  s.done=val;save();render();popCard(id,val);
  toast(val?'Séance faite ✓':'Remise à faire',()=>{s.done=!val;save();render();popCard(id,!val);},val?{label:'RÉEL…',fn:()=>openActual(id)}:null);
}

/* ---------- toast ---------- */
let toastTimer=null,undoFn=null,extraFn=null;
function toast(msg,undo,extra){
  const t=$('#toast');undoFn=undo||null;extraFn=extra?extra.fn:null;
  t.innerHTML='<span>'+esc(msg)+'</span>'+(extra?'<button data-extra="1">'+esc(extra.label)+'</button>':'')+(undo?'<button data-undo="1">ANNULER</button>':'');
  t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),6000);
}

/* ---------- glisser-déposer (souris + appui long au doigt) ---------- */
let drag=null,blockClickUntil=0;
function dragCleanup(){
  if(!drag)return;
  clearTimeout(drag.timer);clearInterval(drag.scroller);
  if(drag.ghost)drag.ghost.remove();
  if(drag.el){drag.el.classList.remove('dragging','swiping');drag.el.style.transform='';const w=drag.el.closest('.sw');if(w){delete w.dataset.dir;delete w.dataset.rev;delete w.dataset.tone;}}
  document.querySelectorAll('.day.drop').forEach(d=>d.classList.remove('drop'));
  document.body.classList.remove('is-dragging');
  drag=null;
}
function startDrag(){
  if(!drag||drag.active)return;
  drag.active=true;
  const r=drag.el.getBoundingClientRect();
  const g=drag.el.cloneNode(true);g.classList.add('drag-ghost');g.classList.remove('dragging');g.style.width=r.width+'px';g.style.setProperty('--c',drag.el.style.getPropertyValue('--c'));
  document.body.appendChild(g);drag.ghost=g;drag.w=r.width;
  drag.el.classList.add('dragging');document.body.classList.add('is-dragging');
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
  drag.scroller=setInterval(()=>{ if(!drag)return; if(drag.y<80)window.scrollBy(0,-14); else if(drag.y>innerHeight-80)window.scrollBy(0,14); updateDrag(); },30);
  updateDrag();
}
function updateDrag(){
  if(!drag||!drag.active)return;
  drag.ghost.style.transform='translate('+Math.round(drag.x-drag.w/2)+'px,'+Math.round(drag.y-30)+'px)';
  const t=document.elementFromPoint(drag.x,drag.y);
  const day=t&&t.closest?t.closest('.day[data-date]'):null;
  document.querySelectorAll('.day.drop').forEach(d=>{if(d!==day)d.classList.remove('drop');});
  if(day)day.classList.add('drop');
  drag.target=day?day.dataset.date:null;
}
document.addEventListener('pointerdown',e=>{
  if(view!=='week'||(e.pointerType==='mouse'&&e.button!==0))return;
  const el=e.target.closest&&e.target.closest('.sess[data-sess]');
  if(!el)return;
  dragCleanup();
  const touch=e.pointerType!=='mouse';
  drag={id:el.dataset.sess,el,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,pid:e.pointerId,touch,active:false,target:null,timer:null};
  if(touch)drag.timer=setTimeout(startDrag,320);
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  drag.x=e.clientX;drag.y=e.clientY;
  const dist=Math.hypot(drag.x-drag.sx,drag.y-drag.sy);
  if(!drag.active){
    if(drag.touch){
      const dx=drag.x-drag.sx,dy=drag.y-drag.sy;
      if(!drag.swipe&&dx<-12&&-dx>Math.abs(dy)*1.4){drag.swipe=true;clearTimeout(drag.timer);drag.el.classList.add('swiping');}
      if(drag.swipe){
        const c=Math.min(0,Math.max(-130,dx)),w=drag.el.closest('.sw');
        drag.el.style.transform='translateX('+c+'px)';
        if(w){if(c<-6){const was=drag.el.classList.contains('done');w.dataset.dir='l';w.dataset.rev=was?'↺ À FAIRE':'✓ FAIT';w.dataset.tone=was?'todo':'done';}else delete w.dataset.dir;}
        return;
      }
      if(dist>10)dragCleanup();return;   // le doigt bouge avant l'appui long : c'est un défilement
    }
    if(dist>6)startDrag();else return;
  }
  updateDrag();
});
document.addEventListener('touchmove',e=>{if(drag&&drag.active)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>{if(drag&&drag.touch)e.preventDefault();});
function endDrag(cancel){
  if(!drag)return;
  if(drag.swipe){
    const dx=drag.x-drag.sx,id=drag.id;
    dragCleanup();blockClickUntil=performance.now()+400;
    if(!cancel&&dx<=-72){const x=state.sessions.find(v=>v.id===id);if(x)setDone(id,!x.done);}
    return;
  }
  const was=drag.active,id=drag.id,target=drag.target;
  dragCleanup();
  if(!was)return;
  blockClickUntil=performance.now()+400;
  if(cancel||!target)return;
  const s=state.sessions.find(x=>x.id===id);
  if(!s||s.date===target)return;
  const from=s.date;
  s.date=target;s.edited=true;save();render();settle(id);
  const d=parse(target);
  toast('Déplacé au '+DOWL[(d.getDay()+6)%7].toLowerCase()+' '+fmtDM(d),()=>{s.date=from;save();render();});
}
document.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pid)endDrag(false);});
document.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pid)endDrag(true);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag&&drag.active)endDrag(true);});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const u=e.target.closest&&e.target.closest('[data-undo]');
  if(u){if(undoFn){undoFn();undoFn=null;}$('#toast').classList.remove('show');return;}
  const ex=e.target.closest&&e.target.closest('[data-extra]');
  if(ex){if(extraFn){const f=extraFn;extraFn=null;$('#toast').classList.remove('show');f();}return;}
  if(performance.now()<blockClickUntil){e.preventDefault();e.stopPropagation();return;}
  const t=e.target.closest('[data-delsport],[data-spopen],[data-sumadd],[data-clearweek],[data-newsport],[data-spgo],[data-newrace],[data-delrace],[data-dots],[data-reveal],[data-copy],[data-cpf],[data-cpm],[data-cpgo],[data-stats],[data-sttab],[data-stw],[data-stm],[data-toggle],[data-chip],[data-q],[data-fab],[data-sess],[data-day],[data-add],[data-race],[data-close],[data-del],[data-export],[data-import],[data-reset]');
  if(!t)return;
  if(t.dataset.dots){const pp=$('#pop');if(pp)pp.hidden=!pp.hidden;return;}
  if(t.dataset.reveal){
    const k=t.dataset.reveal,sh=dlg._shown;if(!sh)return;
    sh[k]=!sh[k];const o=dlg.querySelector('[data-opt="'+k+'"]');if(o)o.hidden=!sh[k];
    const pp=$('#pop');if(pp){pp.innerHTML=dlg._popHTML();pp.hidden=true;}
    if(sh[k]&&k==='notes'){const inp=o&&o.querySelector('textarea');if(inp)setTimeout(()=>inp.focus(),30);}
    return;
  }
  if(!dlg.open&&(t.dataset.sess||t.dataset.add||t.dataset.day||t.dataset.race||t.dataset.copy))setOrigin(t);
  if(t.dataset.copy){openCopy();return;}
  if(t.dataset.cpf){cpF=Number(t.dataset.cpf);renderCopy();return;}
  if(t.dataset.cpm){cpMode=t.dataset.cpm;renderCopy();return;}
  if(t.dataset.cpgo){applyCopy();return;}
  if(t.dataset.sttab){stTab=t.dataset.sttab;renderStats();return;}
  if(t.dataset.stm){stMetric=t.dataset.stm;renderStats();return;}
  if(t.dataset.stw){const v=t.dataset.stw;stW=(v==='-1'||v==='1')?addDays(stW,7*Number(v)):mondayOf(parse(v));renderStats();return;}
  if(t.dataset.toggle){e.preventDefault();const s=state.sessions.find(x=>x.id===t.dataset.toggle);if(s){setDone(s.id,!s.done);if(dlg.open&&t.dataset.keep){const k=s.date;openDay(k);}}return;}
  if(t.dataset.chip){quickDay=t.dataset.chip;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.chip===quickDay));return;}
  if(t.dataset.q){openSession(null,quickDay,t.dataset.q);return;}
  if(t.dataset.close){closeSheet();return;}
  if(t.dataset.sess){openSession(t.dataset.sess);return;}
  if(t.dataset.add){openSession(null,t.dataset.add);return;}
  if(t.dataset.delsport){e.preventDefault();const k=t.dataset.delsport;
    if(!removeSport(k))return;
    const tl=$('#typelist');
    if(tl){const f=$('#sf');let sel=new FormData(f).get('type');if(!sel||!TYPES[sel]||state.hidden.includes(sel))sel=visibleKeys()[0];tl.innerHTML=sportListHTML(sel,'type');const c=$('#spcur');if(c)c.outerHTML=spCurHTML(sel);f.dispatchEvent(new Event('change'));$('#spmenu').hidden=false;}
    else openQuick();
    return;}
  if(t.dataset.spopen){const m=$('#spmenu');m.hidden=!m.hidden;t.setAttribute('aria-expanded',String(!m.hidden));return;}
  if(t.dataset.sumadd){setOrigin(t);const mon=mondayOf(cursor),td=today();const d=diff(mon,td)>=0&&diff(mon,td)<7?iso(td):iso(mon);openSession(null,d,t.dataset.sumadd);return;}
  if(t.dataset.clearweek){
    const mon=mondayOf(cursor),list=weekList(mon);if(!list.length)return;
    if(!confirm('Supprimer les '+list.length+' séance'+(list.length>1?'s':'')+' de la semaine du '+fmtDM(mon)+' ?'))return;
    state.sessions=state.sessions.filter(x=>!list.includes(x));save();render();
    toast(list.length+' séance'+(list.length>1?'s':'')+' supprimée'+(list.length>1?'s':''),()=>{state.sessions=state.sessions.concat(list);save();render();});return;}
  if(t.dataset.newsport){const b=$('#spbox');b.innerHTML=spForm();const i=$('#sp-name');i.focus();i.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();const g=b.querySelector('[data-spgo]');if(g)g.click();}});return;}
  if(t.dataset.spgo){
    const key=addSport(($('#sp-name')||{}).value);if(!key)return;
    const tl=$('#typelist');
    if(tl){tl.innerHTML=sportListHTML(key,'type');$('#spbox').innerHTML=spAddHTML.replace(/^<div id="spbox">|<\/div>$/g,'');const c=$('#spcur');if(c)c.outerHTML=spCurHTML(key);const f=$('#sf');if(f)f.dispatchEvent(new Event('change'));}
    else{openQuick();}
    return;}
  if(t.dataset.newrace){openRace('new');return;}
  if(t.dataset.race){openRace(t.dataset.race);return;}
  if(t.dataset.delrace){if(confirm('Supprimer cette course ?')){state.races=state.races.filter(r=>r.id!==t.dataset.delrace);save();closeSheet();render();}return;}
  if(t.dataset.day){openDay(t.dataset.day);return;}
  if(t.dataset.del){if(confirm('Supprimer cette séance ?')){state.sessions=state.sessions.filter(s=>s.id!==t.dataset.del);save();closeSheet();render();}return;}
  if(t.dataset.export){exportData();return;}
  if(t.dataset.import){$('#file').click();return;}
  if(t.dataset.reset){if(confirm('Effacer tes modifications et revenir au plan d’origine ?')){state=fresh();syncTypes();save();closeSheet();render();}return;}
});
document.addEventListener('change',e=>{
  const c=e.target;
  if(c.id==='m-cap'){state.settings.capKm=num(c.value)||'';save();render();}
  if(c.id==='file'&&c.files&&c.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const n=importData(JSON.parse(r.result));alert('Import terminé : '+n+' séance(s) ajoutée(s).');closeSheet();}catch(err){alert('Fichier illisible.');}};
    r.readAsText(c.files[0]);
  }
});
$('#raceCard').addEventListener('click',e=>{setOrigin(e.currentTarget);openRace(e.currentTarget.dataset.race||'main');});
$('#raceList').addEventListener('click',e=>{setOrigin(e.currentTarget);openRaces();});
$('#raceBand').addEventListener('click',e=>{setOrigin(e.currentTarget);openRaces();});
$('#raceAdd').addEventListener('click',e=>{setOrigin(e.currentTarget);openRace('new');});
$('#fab').addEventListener('click',e=>{setOrigin(e.currentTarget);openQuick();});
$('#btnStats').addEventListener('click',e=>{setOrigin(e.currentTarget);openStats();});
function applyTheme(t,anim){
  const root=document.documentElement;
  if(anim){root.classList.add('theme-anim');setTimeout(()=>root.classList.remove('theme-anim'),500);}
  root.dataset.theme=t;try{localStorage.setItem('prepa-theme',t);}catch(e){}
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#f7f7f8':'#171719');
  const r=$('#rowTheme');if(r)r.setAttribute('aria-checked',String(t==='dark'));
}
applyTheme(document.documentElement.dataset.theme==='light'?'light':'dark',false);
const mpop=$('#mpop');
function toggleMpop(open){mpop.hidden=!open;$('#btnMenu').setAttribute('aria-expanded',String(open));}
$('#btnMenu').addEventListener('click',()=>toggleMpop(mpop.hidden));
$('#rowTheme').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light',true));
$('#rowData').addEventListener('click',e=>{toggleMpop(false);setOrigin($('#btnMenu'));openMenu();});
document.addEventListener('click',e=>{if(!mpop.hidden&&!(e.target.closest&&e.target.closest('.menuwrap')))toggleMpop(false);},true);
/* fond animé : halos flous qui dérivent lentement et se déforment */
(function(){
  const bl=Array.from(document.querySelectorAll('#ambient i'));if(!bl.length)return;
  const rnd=(a,b)=>a+Math.random()*(b-a),rad=()=>[0,0,0,0,0,0,0,0].map(()=>Math.round(rnd(35,65))).reduce((s,v,i)=>s+(i===4?'/ ':'')+v+'% ','');
  const pose=()=>({transform:'translate('+rnd(-15,85)+'vw,'+rnd(-20,80)+'vh) rotate('+rnd(-40,40)+'deg) scale('+rnd(.8,1.3)+','+rnd(.8,1.3)+')',borderRadius:rad()});
  const cur=bl.map(()=>pose());
  bl.forEach((b,i)=>{b.style.transform=cur[i].transform;b.style.borderRadius=cur[i].borderRadius;});
  if(reduce())return;
  const go=i=>{
    const nx=pose(),a=bl[i].animate([cur[i],nx],{duration:rnd(16000,28000),easing:'ease-in-out',fill:'forwards'});
    cur[i]=nx;a.onfinish=()=>{bl[i].style.transform=nx.transform;bl[i].style.borderRadius=nx.borderRadius;a.cancel();go(i);};
  };
  bl.forEach((b,i)=>go(i));
})();

/* appui long sur un sport : corbeille */
let lpT=null,lpFired=false,lpUntil=0;const TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';
function clearLP(){document.querySelectorAll('.lp').forEach(x=>{x.classList.remove('lp');const tr=x.querySelector('.trash');if(tr)tr.remove();});}
dlg.addEventListener('pointerdown',e=>{
  const row=e.target.closest&&e.target.closest('.types.list label,.tiles.list .tile');
  if(!e.target.closest('.trash')&&!(row&&row.classList.contains('lp')))clearLP();
  if(!row||e.target.closest('.trash'))return;
  lpFired=false;clearTimeout(lpT);
  lpT=setTimeout(()=>{
    const key=row.tagName==='LABEL'?String(row.getAttribute('for')||'').replace(/^t-/,''):row.dataset.q;
    if(!key)return;lpFired=true;clearLP();row.classList.add('lp');
    row.insertAdjacentHTML('beforeend','<span class="trash" data-delsport="'+esc(key)+'" role="button" aria-label="Supprimer ce sport">'+TRASH+'</span>');
    if(navigator.vibrate)try{navigator.vibrate(12);}catch(x){}
  },520);
});
['pointerup','pointercancel','pointermove'].forEach(ev=>dlg.addEventListener(ev,e=>{
  if(ev==='pointermove'&&Math.abs(e.movementX)+Math.abs(e.movementY)<3)return;
  clearTimeout(lpT);if(ev==='pointerup'&&lpFired){lpUntil=performance.now()+400;lpFired=false;}
}));
dlg.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.types.list label,.tiles.list .tile'))e.preventDefault();});
document.addEventListener('click',e=>{if(performance.now()<lpUntil&&!(e.target.closest&&e.target.closest('.trash'))){e.preventDefault();e.stopPropagation();}},true);

$('#btnToday').addEventListener('click',e=>{cursor=today();enterNext=true;render();window.scrollTo({top:0,behavior:'smooth'});setOrigin(e.currentTarget);openDay(iso(today()),true);});
$('#vWeek').addEventListener('click',()=>{view='week';enterNext=true;render();});
$('#vMonth').addEventListener('click',()=>{view='month';render();});
function shift(n){
  if(view==='week')cursor=addDays(cursor,7*n);
  else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);
  render();slideView(n);
}
$('#prev').addEventListener('click',()=>shift(-1));
$('#next').addEventListener('click',()=>shift(1));
document.addEventListener('keydown',e=>{
  if(dlg.open||/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')))return;
  if(e.key==='ArrowLeft')shift(-1);else if(e.key==='ArrowRight')shift(1);
});
// glisser sur les côtés (hors cartes) : semaine précédente / suivante
let ws=null;
document.addEventListener('touchstart',e=>{
  if(dlg.open||e.touches.length!==1||drag){ws=null;return;}
  const t=e.target;if(t.closest&&t.closest('.sess,.fab,input,select,textarea,#toast,.drag-ghost')){ws=null;return;}
  ws={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!ws)return;const g=ws;ws=null;if(dlg.open)return;
  const c=e.changedTouches[0],dx=c.clientX-g.x,dy=c.clientY-g.y;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)shift(dx<0?1:-1);
},{passive:true});
// refresh the countdown if the app stays open past midnight
let lastDay=iso(today());
setInterval(()=>{const k=iso(today());if(k!==lastDay){lastDay=k;render();}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const k=iso(today());if(k!==lastDay){lastDay=k;cursor=today();}render();}});

render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload();}});   // nouvelle version : rechargement automatique
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    const chk=()=>{try{r.update();}catch(e){}};
    chk();setInterval(chk,10*60*1000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk();});
    window.addEventListener('focus',chk);
  }).catch(()=>{});
}
})();
